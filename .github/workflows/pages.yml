name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:pages

      - name: Prepare static output
        id: output
        shell: bash
        run: |
          set -euo pipefail

          for dir in dist .output/public; do
            if [ -f "$dir/index.html" ]; then
              touch "$dir/.nojekyll"
              cp "$dir/index.html" "$dir/404.html"
              echo "path=$dir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No static index.html found in .output/public or dist" >&2
          find . -name index.html -not -path "./node_modules/*" -print >&2
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
